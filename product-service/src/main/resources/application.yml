server:
    port: 8083

spring:
    application:
        name: product-service

eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://localhost:8082/eureka/
            datasource:
                url: jdbc:h2:mem:productdb;
                username: root
                password: password
                driver-class-name: org.h2.Driver
            h2:
                console:
                    enabled: true
